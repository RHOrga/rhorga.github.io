{% extends "base.html" %}

{% block title %}{{ section.title }} | {{ config.title }}{% endblock title %}

{% block content %}
<div class="page-content">
    <h1>{{ section.title }}</h1>
    {% if section.description %}
    <p class="page-description">{{ section.description }}</p>
    {% endif %}
    {{ section.content | safe }}
</div>
{% endblock content %}
