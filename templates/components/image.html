{% component image(src, alt, width=768, class="content-image", caption="") %}
<div class="{{ class }}">
    <figure>
        {% set image = resize_image(path=src, width=width,
        op="fit_width", format="webp" ) %}
        <img
            src="{{ image.url }}"
            alt="{{ alt }}"
            width="{{ image.width }}"
            height="{{ image.height }}"
            loading="lazy"
        />
        {% if caption %}
        <figcaption>{{ caption }}</figcaption>
        {% endif %}
    </figure>
</div>
{% endcomponent image %}
