<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        {% set target = "/" ~ config.extra.latest_year ~ "/en/" %}
    <title>RoHOW - Redirecting...</title>
    <meta http-equiv="refresh" content="0;url={{ target }}" />
    <link rel="canonical" href="{{ target }}" />
</head>

<body>
    <p>Redirecting to the latest RoHOW event...</p>
    <p>If you are not automatically redirected, <a href="{{ target }}">click here</a>.</p>
    <script>
        window.location.replace({{ target | json_encode | safe }});
    </script>
</body>

</html>
